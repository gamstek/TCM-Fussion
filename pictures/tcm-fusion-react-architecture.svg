<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" viewBox="0 0 2220 984" width="2220" height="984" role="img" aria-labelledby="ttl description">
<title id="ttl">TCM Fusion 中药材显微鉴别架构</title>
<desc id="description">上方六个节点从左到右表示主流程。下方展开中间 ReAct 调查区的三个条件机制：实例目标编译成局部语义 DAG 并逐节点执行，不同视野可由 D4 并发并逐支提交，问题级 Reflection 进入下一轮正常规划并据后续回执核对。各面板末行给出白芍单图运行的核对结果。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#4A6666"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203B40}.title{font-size:40px;font-weight:700;fill:#103E40}.intro{font-size:18px;fill:#425E60}.group{font-size:17px;font-weight:700;fill:#23695F}.stageTitle{font-size:23px;font-weight:700}.tech{font-size:18px;font-weight:700}.body{font-size:16px}.file{font:15.5px Consolas,"Courier New",monospace;fill:#405F61}.edgeText{font-size:12px;font-weight:700;fill:#39595D}.section{font-size:25px;font-weight:700;fill:#183F42}.panelTitle{font-size:27px;font-weight:700}.owner{font-size:17px;font-weight:600;fill:#385756}.desc{font-size:16px;fill:#405653}.chip{font-size:16px;font-weight:600}.tiny{font-size:14px;fill:#466264}.live{font-size:16px;font-weight:600}.out{font-size:13.5px;fill:#4C696A}</style>
<rect x="0" y="0" width="2220" height="984" fill="#FBFBF7" stroke="none" rx="0"/>
<text x="38" y="56" class="title" >TCM Fusion 中药材显微鉴别架构</text>
<text x="39" y="94" class="intro" >从整图候选到可追溯的鉴别结论。横向读取主流程，下方展开调查目标、工具调度与策略反馈。</text>
<rect x="712" y="117" width="1124" height="293" fill="#EAF4EF" stroke="none" rx="12"/>
<text x="726" y="145" class="group" >ReAct 调查区</text>
<text x="857" y="145" class="tiny" >本轮回执与判据缺口进入下轮规划，Agent 可以继续调查或提出复核。</text>
<g id="stage-I">
<rect x="38" y="162" width="258" height="228" fill="#FFFFFF" stroke="#BACDC4" rx="7"/>
<rect x="39" y="163" width="256" height="58" fill="#ECF1ED" stroke="none" rx="6"/>
<text x="167" y="200" class="stageTitle" text-anchor="middle">输入校验</text>
<line x1="38" y1="223" x2="296" y2="223" stroke="#CAD9D3"/>
<text x="51" y="253" class="tech" style="fill:#5D777A">样品与视野绑定</text>
<text x="51" y="283" class="body" >按清单核对路径与 SHA256，</text>
<text x="51" y="307" class="body" >去重后赋予中性视野编号。</text>
<text x="51" y="331" class="body" >预检运行环境与模型权重。</text>
<line x1="51" y1="348" x2="283" y2="348" stroke="#DDE4DE"/>
<text x="51" y="375" class="file" >input_proof.json</text>
</g>
<line x1="300" y1="193" x2="353" y2="193" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="326.5" y="180" class="edgeText" text-anchor="middle">整图</text>
<g id="stage-A">
<rect x="358" y="162" width="302" height="228" fill="#FFFFFF" stroke="#BACDC4" rx="7"/>
<rect x="359" y="163" width="300" height="58" fill="#ECF1ED" stroke="none" rx="6"/>
<text x="509" y="200" class="stageTitle" text-anchor="middle">A · 药材候选</text>
<line x1="358" y1="223" x2="660" y2="223" stroke="#CAD9D3"/>
<text x="371" y="253" class="tech" style="fill:#5D777A">五折 ResNet50</text>
<text x="371" y="283" class="body" >每张整图做五折预测。</text>
<text x="371" y="307" class="body" >各折 Top-K 合并并映射药材 ID，</text>
<text x="371" y="331" class="body" >完整逐折概率留给最终融合。</text>
<line x1="371" y1="348" x2="647" y2="348" stroke="#DDE4DE"/>
<text x="371" y="375" class="file" >a_prediction.json</text>
</g>
<line x1="664" y1="193" x2="717" y2="193" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="690.5" y="180" class="edgeText" text-anchor="middle">候选集</text>
<g id="stage-P">
<rect x="722" y="162" width="321" height="228" fill="#FFFFFF" stroke="#BACDC4" rx="7"/>
<rect x="723" y="163" width="319" height="58" fill="#DDEFE7" stroke="none" rx="6"/>
<text x="882.5" y="200" class="stageTitle" text-anchor="middle">Agent 调查规划</text>
<line x1="722" y1="223" x2="1043" y2="223" stroke="#CAD9D3"/>
<text x="735" y="253" class="tech" style="fill:#337D70">ReAct 与智谱 GLM</text>
<text x="735" y="283" class="body" >读取候选判据、已有回执与额度。</text>
<text x="735" y="307" class="body" >从合法菜单选择动作、目标或复核。</text>
<text x="735" y="331" class="body" >自拟或沿用观察部位与形态提示。</text>
<line x1="735" y1="348" x2="1030" y2="348" stroke="#DDE4DE"/>
<text x="735" y="375" class="file" >agent_trace.json</text>
</g>
<line x1="1047" y1="193" x2="1100" y2="193" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="1073.5" y="180" class="edgeText" text-anchor="middle">动作与委托</text>
<g id="stage-T">
<rect x="1105" y="162" width="346" height="228" fill="#FFFFFF" stroke="#BACDC4" rx="7"/>
<rect x="1106" y="163" width="344" height="58" fill="#DDEFE7" stroke="none" rx="6"/>
<text x="1278" y="200" class="stageTitle" text-anchor="middle">MCP 工具执行</text>
<line x1="1105" y1="223" x2="1451" y2="223" stroke="#CAD9D3"/>
<text x="1118" y="253" class="tech" style="fill:#337D70">主机校验与视觉工具</text>
<text x="1118" y="283" class="body" >校验预算、资格与当前工件。</text>
<text x="1118" y="307" class="body" >YOLO 检测，CNN 分类，GLM 读图。</text>
<text x="1118" y="331" class="body" >方舟 IGM 按需分割，本地标定测量。</text>
<line x1="1118" y1="348" x2="1438" y2="348" stroke="#DDE4DE"/>
<text x="1118" y="375" class="file" >agent_tool_ledger.json</text>
</g>
<line x1="1455" y1="193" x2="1508" y2="193" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="1481.5" y="180" class="edgeText" text-anchor="middle">回执与工件</text>
<g id="stage-B">
<rect x="1513" y="162" width="313" height="228" fill="#FFFFFF" stroke="#BACDC4" rx="7"/>
<rect x="1514" y="163" width="311" height="58" fill="#FFF2CF" stroke="none" rx="6"/>
<text x="1669.5" y="200" class="stageTitle" text-anchor="middle">回执与 B 计分</text>
<line x1="1513" y1="223" x2="1826" y2="223" stroke="#CAD9D3"/>
<text x="1526" y="253" class="tech" style="fill:#9E792F">证据资格与候选审查</text>
<text x="1526" y="283" class="body" >用版本化证据关联视野、实例与回执。</text>
<text x="1526" y="307" class="body" >区分未查、失败、本视野未见。</text>
<text x="1526" y="331" class="body" >对照必需与佐证判据计算 rule_score。</text>
<line x1="1526" y1="348" x2="1813" y2="348" stroke="#DDE4DE"/>
<text x="1526" y="375" class="file" >workflow/evidence/</text>
</g>
<line x1="1830" y1="193" x2="1883" y2="193" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="1856.5" y="180" class="edgeText" text-anchor="middle">调查结束</text>
<g id="stage-F">
<rect x="1888" y="162" width="294" height="228" fill="#FFFFFF" stroke="#BACDC4" rx="7"/>
<rect x="1889" y="163" width="292" height="58" fill="#ECF1ED" stroke="none" rx="6"/>
<text x="2035" y="200" class="stageTitle" text-anchor="middle">融合研判与交付</text>
<line x1="1888" y1="223" x2="2182" y2="223" stroke="#CAD9D3"/>
<text x="1901" y="253" class="tech" style="fill:#5D777A">冻结证据与只读终审</text>
<text x="1901" y="283" class="body" >按候选 ID 融合 A 先验与 B 分。</text>
<text x="1901" y="307" class="body" >智谱 GLM 只读终审，主机核对引用。</text>
<text x="1901" y="331" class="body" >必要时按规则生成解释与复核原因。</text>
<line x1="1901" y1="348" x2="2169" y2="348" stroke="#DDE4DE"/>
<text x="1901" y="375" class="file" >output.json · report.md</text>
</g>
<line x1="1274" y1="410" x2="1274" y2="426" stroke="#91ADA0" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="38" y1="426" x2="2182" y2="426" stroke="#BDCCC2"/>
<text x="38" y="465" class="section" >ReAct 调查区的三项机制</text>
<text x="372" y="463" class="desc" >按授权目标、视野独立性或实际回执触发。每个面板标明所属环节。</text>
<g id="mechanism-C">
<rect x="38" y="485" width="700" height="468" fill="#FFFFFF" stroke="#C5D1CB" rx="9"/>
<rect x="39" y="486" width="698" height="7" fill="#226B5E" stroke="none" rx="4"/>
<a href="../lib/agent/semantic_execution.py"><title>查看本地实现</title>
<text x="56" y="532" class="panelTitle" style="fill:#226B5E">C · 局部语义 DAG</text>
</a>
<text x="56" y="567" class="owner" >Agent 调查规划授权 → MCP 逐节点执行</text>
<text x="56" y="600" class="desc" >将已选实例目标编译成有向无环图。下图以测量目标为例。</text>
<line x1="56" y1="619" x2="720" y2="619" stroke="#DCE4DF"/>
<rect x="58" y="655" width="118" height="65" fill="#EDF7F1" stroke="#A0C5B2" rx="5"/>
<text x="117" y="683.5" class="chip" text-anchor="middle">核验</text>
<text x="117" y="704.5" class="chip" text-anchor="middle">身份</text>
<line x1="177" y1="688" x2="190" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="193" y="655" width="118" height="65" fill="#EDF7F1" stroke="#A0C5B2" rx="5"/>
<text x="252" y="683.5" class="chip" text-anchor="middle">取得</text>
<text x="252" y="704.5" class="chip" text-anchor="middle">掩码</text>
<line x1="312" y1="688" x2="325" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="328" y="655" width="118" height="65" fill="#EDF7F1" stroke="#A0C5B2" rx="5"/>
<text x="387" y="683.5" class="chip" text-anchor="middle">核验用途</text>
<text x="387" y="704.5" class="chip" text-anchor="middle">与标定</text>
<line x1="447" y1="688" x2="460" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="463" y="655" width="118" height="65" fill="#EDF7F1" stroke="#A0C5B2" rx="5"/>
<text x="522" y="683.5" class="chip" text-anchor="middle">取得</text>
<text x="522" y="704.5" class="chip" text-anchor="middle">实测量</text>
<line x1="582" y1="688" x2="595" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="598" y="655" width="118" height="65" fill="#EDF7F1" stroke="#A0C5B2" rx="5"/>
<text x="657" y="683.5" class="chip" text-anchor="middle">更新</text>
<text x="657" y="704.5" class="chip" text-anchor="middle">判据</text>
<text x="56" y="781" class="body" >每个节点读取当前有效工件，前置满足后才绑定工具。</text>
<text x="56" y="806" class="body" >已有合格结果可复用。目标完成、资格不足或依赖失效时回交 ReAct。</text>
<text x="56" y="831" class="body" >若 Agent 仅授权核验身份，局部图止于身份节点。</text>
<text x="56" y="854" class="body" >单视野定量问题可先解析唯一实例，实例不确定时回交。</text>
<text x="56" y="878" class="file" >workflow/semantic_plan.json</text>
<rect x="39" y="896" width="698" height="56" fill="#EDF7F1" stroke="none" rx="7"/>
<text x="56" y="918" class="out" >白芍单图核对</text>
<text x="56" y="940" class="live" >白芍第 2 轮的测长目标完成了五个节点。</text>
</g>
<g id="mechanism-D">
<rect x="760" y="485" width="700" height="468" fill="#FFFFFF" stroke="#C5D1CB" rx="9"/>
<rect x="761" y="486" width="698" height="7" fill="#345E83" stroke="none" rx="4"/>
<a href="../lib/agent/physical_execution.py"><title>查看本地实现</title>
<text x="778" y="532" class="panelTitle" style="fill:#345E83">D4 · 跨视野并发调度</text>
</a>
<text x="778" y="567" class="owner" >Agent 选独立视野 → 主机预约与分支提交</text>
<text x="778" y="600" class="desc" >同时选择不同视野的同类初检或单实例分类，当前模板最多四路。</text>
<line x1="778" y1="619" x2="1442" y2="619" stroke="#DCE4DF"/>
<rect x="780" y="665" width="108" height="48" fill="#EFF4F9" stroke="#A7BDD2" rx="5"/>
<text x="834" y="695" class="chip" text-anchor="middle">预约资源</text>
<rect x="971" y="636" width="147" height="42" fill="#EFF4F9" stroke="#A7BDD2" rx="5"/>
<text x="1044.5" y="663" class="chip" text-anchor="middle">视野 A · 初检</text>
<rect x="971" y="704" width="147" height="42" fill="#EFF4F9" stroke="#A7BDD2" rx="5"/>
<text x="1044.5" y="731" class="chip" text-anchor="middle">视野 B · 初检</text>
<rect x="1199" y="663" width="190" height="52" fill="#EFF4F9" stroke="#A7BDD2" rx="5"/>
<text x="1294" y="695" class="chip" text-anchor="middle">逐支验收与提交</text>
<path d="M889 689 H929 V657 H967" fill="none" stroke="#4A6666" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M929 689 V725 H967" fill="none" stroke="#4A6666" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M1118 657 H1160 V689 H1195" fill="none" stroke="#4A6666" stroke-width="1.7" marker-end="url(#arr)"/>
<path d="M1118 725 H1160 V689" fill="none" stroke="#4A6666" stroke-width="1.7"/>
<text x="778" y="781" class="body" >主机为每支绑定输入与额度，验收后逐支提交。</text>
<text x="778" y="806" class="body" >快支结果达到提前回交条件时唤醒 ReAct，其余结果在汇合时处理。</text>
<text x="778" y="831" class="body" >可提前回交的进展包括解锁后继动作、解决判据或新增合格反证。</text>
<text x="778" y="872" class="file" >agent_trace.json · physical_partial / physical_join</text>
<rect x="761" y="896" width="698" height="56" fill="#EFF4F9" stroke="none" rx="7"/>
<text x="778" y="918" class="out" >白芍单图核对</text>
<text x="778" y="940" class="live" >白芍第 6、7 轮使用同图观察组。单图未触发跨视野 D4。</text>
</g>
<g id="mechanism-R">
<rect x="1482" y="485" width="700" height="468" fill="#FFFFFF" stroke="#C5D1CB" rx="9"/>
<rect x="1483" y="486" width="698" height="7" fill="#826125" stroke="none" rx="4"/>
<a href="../lib/agent/reflection_controller.py"><title>查看本地实现</title>
<text x="1500" y="532" class="panelTitle" style="fill:#826125">Reflection · 任务内反思</text>
</a>
<text x="1500" y="567" class="owner" >工具回执与 B 判据变化 → 下一轮 Agent 规划</text>
<text x="1500" y="600" class="desc" >本地控制器将失败或无进展绑定到具体问题，生成反思卡。</text>
<line x1="1500" y1="619" x2="2164" y2="619" stroke="#DCE4DF"/>
<rect x="1501" y="655" width="141" height="65" fill="#FBF5E9" stroke="#D8C394" rx="5"/>
<text x="1571.5" y="683.5" class="chip" text-anchor="middle">实际反馈</text>
<text x="1571.5" y="704.5" class="chip" text-anchor="middle">失败或停滞</text>
<line x1="1643" y1="688" x2="1671" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1674" y="655" width="141" height="65" fill="#FBF5E9" stroke="#D8C394" rx="5"/>
<text x="1744.5" y="683.5" class="chip" text-anchor="middle">生成</text>
<text x="1744.5" y="704.5" class="chip" text-anchor="middle">反思卡</text>
<line x1="1816" y1="688" x2="1844" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1847" y="655" width="141" height="65" fill="#FBF5E9" stroke="#D8C394" rx="5"/>
<text x="1917.5" y="683.5" class="chip" text-anchor="middle">下轮规划</text>
<text x="1917.5" y="704.5" class="chip" text-anchor="middle">回应建议</text>
<line x1="1989" y1="688" x2="2017" y2="688" stroke="#4A6666" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="2020" y="655" width="141" height="65" fill="#FBF5E9" stroke="#D8C394" rx="5"/>
<text x="2090.5" y="683.5" class="chip" text-anchor="middle">后续回执</text>
<text x="2090.5" y="704.5" class="chip" text-anchor="middle">核对效果</text>
<text x="1500" y="781" class="body" >Agent 可采纳、维持、推迟或拒绝建议，与正常规划共用一次调用。</text>
<text x="1500" y="806" class="body" >采纳后，仅调整本次调查策略。</text>
<text x="1500" y="831" class="body" >后续用新增合格证据、已解判据或新解锁动作核对实际效果。</text>
<text x="1500" y="872" class="file" >workflow/reflection_controller.json</text>
<rect x="1483" y="896" width="698" height="56" fill="#FBF5E9" stroke="none" rx="7"/>
<text x="1500" y="918" class="out" >白芍单图核对</text>
<text x="1500" y="940" class="live" >白芍第 5 轮采纳 switch_question，额外规划调用为 0。</text>
</g>
</svg>
