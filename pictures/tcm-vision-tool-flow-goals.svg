<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1050" viewBox="0 0 2800 1050" xml:lang="zh-CN" role="img" aria-labelledby="h d">
<title id="h">中药材显微鉴别流程</title><desc id="d">主线由输入到交付。图中展开 MCP 视觉工具。Stage2 判断裁图中特征身份，低置信时可复核。身份确认且获准量测后分割，再结合合格掩码与有效标定计算尺寸。Agent 一次授权局部目标，执行器复用已有结果，按依赖连续推进，完成或受阻时回交 Agent。</desc>
<defs><marker id="arrow-main" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3C6060"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2E7968"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#916A27"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607A84"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173E3E}.title{font-size:49px;font-weight:700}.intro{font-size:22px;fill:#536D67}.mainHead{font-size:25px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:16px;fill:#36554F}.mainBody{font-size:17px;fill:#36554F}.legend{font-size:18px;fill:#385B52}.group{font-size:29px;font-weight:700;fill:#215A4E}.edge{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.lbl,.small,.amber{font-size:16px;fill:#375E56;font-weight:600;paint-order:stroke;stroke:#FAFBF7;stroke-width:5px;stroke-linejoin:round}.small{font-size:14px}.amber{fill:#825F27}.quiet{fill:#5A7068;font-size:18px}</style>
<rect width="2800" height="1050" fill="#FCFBF7"/>
<text x="43" y="73" class="title" >中药材显微鉴别流程</text>
<text x="44" y="116" class="intro" >Agent 决定查什么，依赖关系决定何时能调用下一步工具。</text>
<rect x="745" y="293" width="1402" height="452" rx="16" fill="#F8FBF7" stroke="#6B9B88" stroke-width="1.7"/>
<text x="768" y="334" class="group" >MCP 视觉工具执行</text>
<text x="1072" y="331" class="legend" >按授权选择工具入口，已有合格工件可复用。</text>
<line x1="768" y1="351" x2="2125" y2="351" stroke="#CEDBD2"/>
<path d="M196 461 H233" class="edge" stroke="#3C6060" marker-end="url(#arrow-main)"/>
<path d="M418 461 H453" class="edge" stroke="#3C6060" marker-end="url(#arrow-main)"/>
<path d="M686 461 H742" class="edge" stroke="#3C6060" marker-end="url(#arrow-main)"/>
<path d="M2148 461 H2229" class="edge" stroke="#3C6060" marker-end="url(#arrow-main)"/>
<path d="M2462 461 H2548" class="edge" stroke="#3C6060" marker-end="url(#arrow-main)"/>
<text x="717" y="445" class="small" text-anchor="middle">单项</text>
<text x="2190" y="445" class="small" text-anchor="middle">实际回执</text>
<text x="2503" y="445" class="small" text-anchor="middle">调查收尾</text>
<path d="M564 395 V211 H673" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M993 211 H1050" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M1363 211 H1456 V291" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<text x="575" y="305" class="lbl">一次授权局部目标</text>
<path d="M1208 165 V138 H493 V393" class="edge" stroke="#607A84" marker-end="url(#arrow-slate)"/>
<text x="912" y="128" class="lbl" text-anchor="middle">任务完成或受阻，回交 Agent</text>
<text x="1471" y="251" class="lbl" >按需调用</text>
<path d="M623 528 V820 H698" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M1000 820 H1065 V747" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<text x="609" y="718" class="lbl" text-anchor="end">独立视野</text>
<text x="1079" y="794" class="lbl" >逐支派发</text>
<path d="M2269 527 V963" class="edge" stroke="#2E7968" />
<text x="2251" y="821" class="lbl" text-anchor="end">结果、受阻原因与缺口</text>
<path d="M2392 527 V779" class="edge" stroke="#916A27" marker-end="url(#arrow-gold)"/>
<text x="2406" y="685" class="amber" >失败或停滞</text>
<path d="M2528 869 V963 H2269" class="edge" stroke="#916A27" />
<path d="M2269 963 H504 V529" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<circle cx="2269" cy="963" r="5" fill="#2E7968"/>
<text x="519" y="925" class="lbl" >回到下一轮 Agent 规划</text>
<text x="2542" y="925" class="amber" >随下轮规划提交建议</text>
<text x="1420" y="1008" class="quiet" text-anchor="middle">并行分支取得合格进展时可提前反馈，Agent 根据最新回执继续调查或收尾。</text>
<g id="node-input">
<rect x="39" y="395" width="157" height="132" rx="12" fill="#FFFFFF" stroke="#9AB2A9" stroke-width="1.7"/>
<text x="117.5" y="456" class="mainHead" text-anchor="middle">输入校验</text>
<text x="117.5" y="486" class="mainBody" text-anchor="middle">核对图像与清单</text>
</g>
<g id="node-prior">
<rect x="235" y="395" width="183" height="132" rx="12" fill="#FFFFFF" stroke="#9AB2A9" stroke-width="1.7"/>
<text x="326.5" y="456" class="mainHead" text-anchor="middle">药材候选提名</text>
<text x="326.5" y="486" class="mainBody" text-anchor="middle">CNN预测识别</text>
</g>
<g id="node-plan">
<rect x="456" y="395" width="230" height="132" rx="12" fill="#DCEFE3" stroke="#43846D" stroke-width="1.7"/>
<text x="571" y="456" class="mainHead" text-anchor="middle">Agent 调查规划</text>
<text x="571" y="486" class="mainBody" text-anchor="middle">选择视野与观察重点</text>
</g>
<g id="node-facts">
<rect x="2232" y="395" width="230" height="132" rx="12" fill="#FBF0D9" stroke="#BF9E5F" stroke-width="1.7"/>
<text x="2347" y="456" class="mainHead" text-anchor="middle">回执与判据计分</text>
<text x="2347" y="486" class="mainBody" text-anchor="middle">更新支持、反证与缺口</text>
</g>
<g id="node-finish">
<rect x="2551" y="395" width="210" height="132" rx="12" fill="#FFFFFF" stroke="#9AB2A9" stroke-width="1.7"/>
<text x="2656" y="456" class="mainHead" text-anchor="middle">融合研判与交付</text>
<text x="2656" y="486" class="mainBody" text-anchor="middle">候选、依据与复核状态</text>
</g>
<g id="node-dag">
<rect x="676" y="166" width="317" height="90" rx="12" fill="#DFF0E5" stroke="#44886F" stroke-width="1.7"/>
<text x="834.5" y="206" class="head" text-anchor="middle">DAG 编排局部取证任务</text>
<text x="834.5" y="236" class="body" text-anchor="middle">实例核验或单视野定量取证</text>
</g>
<g id="node-deps">
<rect x="1053" y="166" width="310" height="90" rx="12" fill="#F1F7F2" stroke="#85AB98" stroke-width="1.7"/>
<text x="1208" y="206" class="head" text-anchor="middle">按依赖自动连续执行</text>
<text x="1208" y="236" class="body" text-anchor="middle">复用已有结果，前置满足即推进</text>
</g>
<g id="node-parallel">
<rect x="701" y="774" width="299" height="92" rx="12" fill="#F1F7F2" stroke="#85AB98" stroke-width="1.7"/>
<text x="850.5" y="815" class="head" text-anchor="middle">并行调查多个视野</text>
<text x="850.5" y="845" class="body" text-anchor="middle">按视野独立初检或分类</text>
</g>
<g id="node-reflect">
<rect x="2350" y="781" width="355" height="88" rx="12" fill="#FBF0D9" stroke="#BF9E5F" stroke-width="1.7"/>
<text x="2527.5" y="820" class="head" text-anchor="middle">生成反思建议</text>
<text x="2527.5" y="850" class="body" text-anchor="middle">Agent 决定是否调整调查策略</text>
</g>
<path d="M924 461 H951" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M1106 461 H1134" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M1341 461 H1478" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M1664 461 H1691" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M1860 461 H1928" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<path d="M2124 461 H2147" class="edge" stroke="#3C6060" />
<text x="938" y="399" class="small" text-anchor="middle">定位框</text>
<text x="1121" y="399" class="small" text-anchor="middle">实例裁图</text>
<text x="1410" y="441" class="small" text-anchor="middle">身份通过且需测量</text>
<text x="1678" y="399" class="small" text-anchor="middle">实例掩码</text>
<text x="1894" y="441" class="small" text-anchor="middle">合格</text>
<path d="M1268 513 V563" class="edge" stroke="#607A84" marker-end="url(#arrow-slate)"/>
<text x="1280" y="545" class="small" >低置信或其他类，可选</text>
<path d="M1364 609 H1440 V463" class="edge" stroke="#2E7968" marker-end="url(#arrow-green)"/>
<text x="1400" y="593" class="small" text-anchor="middle">通过</text>
<path d="M1790 566 V515" class="edge" stroke="#607A84" marker-end="url(#arrow-slate)"/>
<text x="1804" y="547" class="small" >有效标定</text>
<path d="M870 651 V697 H2200 V463" class="edge" stroke="#607A84" marker-end="url(#arrow-slate)"/>
<path d="M1153 513 V697" class="edge" stroke="#607A84" />
<path d="M1270 649 V697" class="edge" stroke="#607A84" />
<circle cx="1153" cy="697" r="4" fill="#607A84"/><circle cx="1270" cy="697" r="4" fill="#607A84"/><circle cx="2200" cy="461" r="4" fill="#3C6060"/>
<text x="1143" y="663" class="small" text-anchor="end">仅核验身份</text>
<text x="1617" y="683" class="lbl" text-anchor="middle">原图观察、身份结果或受阻原因</text>
<g id="node-locate">
<rect x="763" y="410" width="161" height="102" rx="12" fill="#F1F7F2" stroke="#85AB98" stroke-width="1.7"/>
<text x="843.5" y="444.5" class="head" text-anchor="middle">特征定位</text>
<text x="843.5" y="474.5" class="body" text-anchor="middle">YOLO 初检</text>
<text x="843.5" y="497.5" class="body" text-anchor="middle">或 GLM 定向补扫</text>
</g>
<g id="node-crop">
<rect x="953" y="410" width="153" height="102" rx="12" fill="#F1F7F2" stroke="#85AB98" stroke-width="1.7"/>
<text x="1029.5" y="444.5" class="head" text-anchor="middle">原图裁剪</text>
<text x="1029.5" y="474.5" class="body" text-anchor="middle">按定位框取图</text>
<text x="1029.5" y="497.5" class="body" text-anchor="middle">绑定原图坐标</text>
</g>
<g id="node-stage2">
<rect x="1137" y="410" width="204" height="102" rx="12" fill="#DFF0E5" stroke="#44886F" stroke-width="1.7"/>
<text x="1239" y="444.5" class="head" text-anchor="middle">Stage2 分类器</text>
<text x="1239" y="474.5" class="body" text-anchor="middle">ResNet18 判断</text>
<text x="1239" y="497.5" class="body" text-anchor="middle">裁图中的显微特征</text>
</g>
<g id="node-segment">
<rect x="1481" y="410" width="183" height="102" rx="12" fill="#F1F7F2" stroke="#85AB98" stroke-width="1.7"/>
<text x="1572.5" y="444.5" class="head" text-anchor="middle">实例分割</text>
<text x="1572.5" y="474.5" class="body" text-anchor="middle">火山方舟 IGM</text>
<text x="1572.5" y="497.5" class="body" text-anchor="middle">生成实例掩码</text>
</g>
<g id="node-mask">
<rect x="1694" y="410" width="166" height="102" rx="12" fill="#F1F7F2" stroke="#85AB98" stroke-width="1.7"/>
<text x="1777" y="444.5" class="head" text-anchor="middle">核验掩码与用途</text>
<text x="1777" y="474.5" class="body" text-anchor="middle">检查实例匹配</text>
<text x="1777" y="497.5" class="body" text-anchor="middle">及量测资格</text>
</g>
<g id="node-measure">
<rect x="1930" y="410" width="194" height="102" rx="12" fill="#DFF0E5" stroke="#44886F" stroke-width="1.7"/>
<text x="2027" y="444.5" class="head" text-anchor="middle">本地几何测量</text>
<text x="2027" y="474.5" class="body" text-anchor="middle">按目标取长度、</text>
<text x="2027" y="497.5" class="body" text-anchor="middle">宽度或面积</text>
</g>
<g id="node-obs">
<rect x="763" y="566" width="236" height="85" rx="12" fill="#EDF3F4" stroke="#8EA9AE" stroke-width="1.7"/>
<text x="881" y="603.5" class="head" text-anchor="middle">GLM 原图观察</text>
<text x="881" y="633.5" class="body" text-anchor="middle">独立回答存在性或形态问题</text>
</g>
<g id="node-review">
<rect x="1175" y="566" width="189" height="83" rx="12" fill="#EDF3F4" stroke="#8EA9AE" stroke-width="1.7"/>
<text x="1269.5" y="602.5" class="head" text-anchor="middle">GLM 身份复核</text>
<text x="1269.5" y="632.5" class="body" text-anchor="middle">复核同一实例裁图</text>
</g>
<g id="node-scale">
<rect x="1691" y="566" width="204" height="83" rx="12" fill="#EDF3F4" stroke="#8EA9AE" stroke-width="1.7"/>
<text x="1793" y="602.5" class="head" text-anchor="middle">比例尺标定</text>
<text x="1793" y="632.5" class="body" text-anchor="middle">读取同一视野的比例尺</text>
</g>
</svg>
